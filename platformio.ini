[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Expose the project's include/ directory to all lib/ game libraries.
; Without this, lib/DinoGame/ (and every future game) can't find
; GameBase.h, GameUtils.h, InputManager.h, Sound.h, etc.
build_flags = -I include

lib_deps =
    olikraus/U8g2@^2.35.7